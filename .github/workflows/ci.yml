name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Headless checks
        run: npm run check

      # Vercel builds main on its own schedule, so this reports on production
      # rather than gating a commit on it: a pull request must never go red
      # because a deploy has not landed yet.
      - name: Is production serving this build?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run verify:shell -- https://diner-town.vercel.app dist/index.html
